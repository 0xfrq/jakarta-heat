s wisata Jakarta Explorer dari Transjakarta yang bisa dinaiki. Rutenya apa saja, ya? Tempat-tempat seru apa\u0026nbsp;\u003ci\u003eaja\u0026nbsp;\u003c/i\u003enih, yang dilewati? Yuk, cek di bawah!\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/43T3ZCGTcqfq6RQVQprCdswYLakwNVX4eAw8id4Zl8d2TOu8YdtLCX35_kTswiXEMEa3E3w2Ry7IhPMc1sDXmlXywA2DpEtZcYzibDd_UtwvwLeMy6tWdDk7HFo9RXpw__2TepmeiDpWyzKBKUTmS8s\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBus wisata Jakarta Explorer dari Transjakarta. Sumber: Jakarta Smart City\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW1: Sejarah Jakarta (History of Jakarta)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKamu termasuk orang yang\u0026nbsp;\u003ci\u003ekepo\u0026nbsp;\u003c/i\u003esama sejarah Jakarta? Nah, berarti kamu harus naik rute BW1: Sejarah Jakarta (\u003ci\u003eHistory of Jakarta\u003c/i\u003e). Rute ini melewati tempat-tempat penting, contohnya Balai Kota DKI Jakarta, yang menjadi tempat administratif Jakarta. Selain itu, kamu juga bisa melihat salah satu ikon terpenting di Indonesia, yaitu Monas (Monumen Nasional).\u0026nbsp;\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW1: Sejarah Jakarta (\u003ci\u003eHistory of Jakarta\u003c/i\u003e) melayani penumpang pada Senin–Sabtu, pukul 10:00–18:00 WIB. Khusus Minggu, kamu bisa menaikinya jam 09:00–19:00. Tempat-tempat yang dilewati oleh bus rute ini adalah:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum Nasional;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGedung Arsip;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum BI (Bank Indonesia);\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBNI 46;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMasjid Jami Kebon Jeruk;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePasar Baru;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/zdirK7bUk63gdMCVTQyqreq5Nf2AOtN45rU8THCeRBH_ELZVjM2lBbkPRVjnWH8ByHCnizHbac2BLipmK__0aWrqczGa28hKdR65YFMVnYKyDSAMhkGkYgeNT8WH0T2Vi7ybchs7NSXOIlmF5spugeg\" alt=\"Peta perjalanan BW1 – Sejarah Jakarta (History of Jakarta). Sumber:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePeta perjalanan BW1 – Sejarah Jakarta (\u003ci\u003eHistory of Jakarta\u003c/i\u003e). Sumber:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eNah, sebelum berangkat, kamu harus perhatikan rute perjalanannya. Halte yang melayani rute BW1: Sejarah Jakarta (\u003ci\u003eHistory of Jakarta\u003c/i\u003e) adalah:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u0026nbsp;Juanda Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum Bank Indonesia; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKali Besar Barat 1.\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/Oqvjq75uiSeWukKSSeccDpSY9I1OQtyA22bACpe3GW80ez3bcJtpds7MokH3e4W-KNsL2OyRxVBQrzgJJVIcKK_D6ZRbzkUrfOnFkdrBJhDeRrRSHbFq6r3ZGe271rGIcbpiay7T2AnOvCFSRWP-V00\" alt=\"Rute perjalanan BW1: Sejarah Jakarta (History of Jakarta). Sumber:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eRute perjalanan BW1: Sejarah Jakarta (\u003ci\u003eHistory of Jakarta\u003c/i\u003e). Sumber:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/peta-rute/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW2: Jakarta Baru (Jakarta Modern)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSiapa nih, yang kekinian banget? Buat kamu yang mau menikmati kemodernan Jakarta, silakan nikmati rute BW2: Jakarta Baru (\u003ci\u003eJakarta Modern\u003c/i\u003e). Rute ini melewati mal-mal unggulan di Jakarta, seperti Sarinah. Di situ, kamu bisa menelusuri toko-toko yang menjual berbagai produk lokal dan menikmati Jakarta dari atap (\u003ci\u003erooftop\u003c/i\u003e) dan anjungannya. Ada juga Plaza Indonesia, mal yang cocok menjadi tempat rekreasimu.\u0026nbsp;\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKamu bisa menikmati BW2: Jakarta Baru (\u003ci\u003eJakarta Modern\u003c/i\u003e) pada Senin–Sabtu pukul 10:00–18:00 WIB dan Minggu jam 12:00–19:00. Tempat-tempat yang dilewatinya adalah:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePlaza Indonesia;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMenara Topas;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum Nasional;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePecenongan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePasar Baru;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda/Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u ransparent;color:#000000;\"\u003eBuat kamu yang cinta kesenian dan kuliner, bus wisata Transjakarta dapat pula mengantarkanmu untuk menikmati akhir pekan, nih. Rute BW3: Kesenian dan Kuliner (\u003ci\u003eArt and Culinary\u003c/i\u003e) melewati kawasan perdagangan menarik seperti Pasar Baru. Ada beragam kuliner di sepanjang perjalanan yang bisa kamu nikmati.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW3: Kesenian dan Kuliner (\u003ci\u003eArt and Culinary\u003c/i\u003e) melayani penumpangnya setiap Sabtu, pukul 10:00–23:00 WIB. Dari Balai Kota DKI Jakarta sampai IRTI, inilah tempat-tempat yang dilewati:\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum Nasional;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGedung Arsip;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum BI;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBNI 46;\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMasjid Kebon Jeruk;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePasar Baru;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda/Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:# \u003c/i\u003e).\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTidak hanya akhir pekan, kamu juga bisa menikmati rute BW4: Pencakar Langit (\u003ci\u003eJakarta Skyscrapers\u003c/i\u003e) pada Senin–Jumat pukul 06:00–17:00 WIB, Sabtu jam 10:00–17:00 WIB, dan Minggu pukul 12:00–19:00 WIB. Sedangkan tempat-tempat yang dilewatinya adalah:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eThamrin 10;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eWisma Nusantara;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDukuh Atas 3;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKaret Sudirman 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGBK 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBundaran Senayan 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eFX Sudirman;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGBK 2;\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eAquatic Stadium;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIstora;\u003c/span\u003e\u003c/li\ ttps://transjakarta.co.id/peta-rute/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW5: Ruang Terbuka (Jakarta Open Space)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eRTH (Ruang Terbuka Hijau) pun bisa menjadi tempat rekreasi yang sehat. Penyelenggaraannya diatur\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://jdih.jakarta.go.id/dokumen/detail/4911/peraturan-gubernur-nomor-9-tahun-2022-tentang-ruang-terbuka-hijau\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003ePeraturan Gubernur\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u0026nbsp; Nomor 9 Tahun 2022 tentang Ruang Terbuka Hijau. Kalau kamu menaiki rute BW5: Ruang Terbuka (\u003ci\u003eJakarta Open Space\u003c/i\u003e), jangan lupa mampir ke\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://www.instagram.com/p/B4fDd7sAl-e/?img_index=1\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003eRPTRA (Ruang Publik Terpadu Ramah Anak) Kalijodo\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e, ya! Sebagai ruang terbuka, RPTRA Kalijodo punya berbagai fasilitas yang bisa dinikmati pengunjungnya.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW5: Ruang Terbuka (\u003ci\u003eJakarta Open Space\u003c/i\u003e) beroperasi pada Senin–Jumat pukul 10:00–18:00 WIB. Selain itu, kamu bisa menikmati layanannya pada Sabtu jam 10:00–23:00 WIB dan Minggu pukul 12:00–19:00 WIB. Yuk, catat rute perjalanannya:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eRPTRA Kalijodo;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBundaran HI;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/5K0cqxjG4PvzdQaBMQKdAo72Q1vLkoibJ9_QMHXeHADD5b7s2bT3cIczKt3qKvQ2slq9gDtNMjpjiHoXQwANQDvZczFiy8Y_LfhZvTr_xH1Nzj4GJ-V1hXW42I6hUUIHnXmL2_8cL7X45juJTIVb8VE\" alt=\"Peta perjalanan BW5: Ruang Terbuka (Jakarta Open Space). Sumber:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePeta perjalanan BW5: Ruang Terbuka (\u003ci\u003eJakarta Open Space\u003c/i\u003e). Sumber:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW6: Cagar Budaya Jakarta (Jakarta Heritage)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eCagar budaya tercipta untuk melestarikan suatu kawasan yang bernilai sejarah. Di Jakarta Utara, terdapat\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://jakarta-tourism.go.id/article/detail/mbah-prioks-tomb-jakarta-utara\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003eMakam Mbah Priok\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e yang dianggap keramat. Untuk berkunjung ke sana, caranya gampang, lo! Kamu bisa menaiki BW6: Cagar Budaya Jakarta (\u003ci\u003eJakarta Heritage\u003c/i\u003e).\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKamu tertarik? Yuk, luangkan waktumu pada Sabtu–Minggu pukul 10:00–19:00 WIB. Bus wisata tersebut melewati tempat-tempat ini:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMakam Mbah Priok;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBundaran HI;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMenara Topas;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda/Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 1; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/9-caQVxM3IWDzXPJ5rfUxRwwz509JrjgV5ckfqcxHS54_DzE66DeOEZBU88vCtQCDvdf1QKgtf3lRGZW2UNCF8GPoIP2hpcYAUUIpkA_J2DZcA9JrAYwccp5SdVkbVC7XyGL-SpRSj2bxCtopXiHS88\" alt=\"Peta perjalanan BW6: Cagar Budaya Jakarta (Jakarta Heritage). Sumber:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePeta perjalanan BW6: Cagar Budaya Jakarta (\u003ci\u003eJakarta Heritage\u003c/i\u003e). Sumber:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW7: Belanja Jakarta (Jakarta Shopping)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSiapa nih, yang sering “\u003ci\u003elapar mata\u003c/i\u003e” alias selalu mau belanja? Nah, bus wisata ini berarti cocok buat kamu. BW7: Belanja Jakarta (\u003ci\u003eJakarta Shopping\u003c/i\u003e) melayani rute yang melewati beragam pusat perbelanjaan, seperti Plaza Senayan dan Senayan City.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW7: Belanja Jakarta (\u003ci\u003eJakarta Shopping\u003c/i\u003e) beroperasi pada Senin–Jumat, pukul 10:00–18:00 WIB. Setiap Sabtu, kamu bisa menikmatinya pula pada 10:00–22:00 WIB. Inilah tempat-tempat yang dilewatinya, jangan lupa catat, ya:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eWisma Nusantara;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDukuh Atas 3;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKaret Sudirman 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eLapangan Panahan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIstora Senayan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePlaza Senayan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSenayan City;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKaret Sudirman 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDukuh Atas 4;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eStasiun Sudirman;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePlaza Indonesia;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/ZxYjI5qu9rIEoWaPcw6te1hxyR8ln_r103GhqJGg-oegVbTt0JWBlINp55dTM-Qmi3hz6k6-Ue6pEArL-lAEdaLJjuOaiN8CRaTvlllQXhbz8Q__bezl5wKkaAofeYAFJRbYnxeSf4vaK7lFeERoWpw\" alt=\"Peta perjalanan BW7: Belanja Jakarta (Jakarta Shopping). Sumber:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePeta perjalanan BW7: Belanja Jakarta (\u003ci\u003eJakarta Shopping\u003c/i\u003e). Sumber:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBerapa Tarif Bus Wisata Transjakarta?\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePT Transportasi Jakarta memberi layanan 22 bus wisata Jakarta Explorer untuk tujuh rute di atas. Yang menarik adalah kamu bisa berkeliling Jakarta dengan konsep bus tingkat. Apakah karena itu tarifnya menjadi lebih mahal daripada bus Transjakarta biasa? Ternyata enggak! Justru dengan menaiki Jakarta Explorer, kamu hanya dikenakan biaya\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://x.com/PT_Transjakarta/status/1652243634970845186?s=20\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003eRp0\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e alias gratis. Namun, kamu tetap perlu melakukan\u0026nbsp;\u003ci\u003etap in\u003c/i\u003e atau ketuk\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/info-tiket/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003ekartu elektronik\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u0026nbsp; di mesin ya.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eApakah kamu sudah siap berekreasi bareng Jakarta Explorer? Keseharianmu pun dapat menjadi lebih mudah dengan menaiki bus Transjakarta. Bahkan,\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://jaki.jakarta.go.id/id/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003eJAKI\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u0026nbsp; bisa bikin gampang kamu mengecek jadwal, rute, dan tarifnya. Setelah aplikasi terbuka, kamu hanya perlu mencari fitur Transportasi Publik di bilah pencarian dan klik Transjakarta.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/Rlsd5_eH5dn5hoWY1Fsh5ZjRj-YGxVIWWRUZw7VH-F53SxtAVwBzMBIbc0zzrojZOb70Ez4Qg80mciS4qpVn7seCsfTobJgm2CNhy1NqTnOGLd2Ck4McR5reCOvXvCUbpYAhtVHVrdt1U70xTLI_NXo\" alt=\"Fitur Transportasi Publik di JAKI\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eFitur Transportasi Publik di JAKI\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSelamat jalan-jalan! Mau tahu informasi lainnya seputar mobilitas atau transportasi publik di Jakarta? Silakan follow\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://linktr.ee/jakartasmartcity\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003e@jsclab\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e, ya!\u003c/span\u003e\u003c/p\u003e","description_english":"\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSmartcitizens, do you take Transjakarta every day? This kind of public transportation can indeed be a suitable choice for your mobility. During the weekends, what do you take? Transjakarta could definitely be your choice too! Every weekend or even on weekdays, there's the\u0026nbsp;\u003ci\u003ebus wisata\u003c/i\u003e (tour bus) Jakarta Explorer by Transjakarta that you can hop on. What routes does it serve? What exciting places does it pass by? Let's check them out below!\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/43T3ZCGTcqfq6RQVQprCdswYLakwNVX4eAw8id4Zl8d2TOu8YdtLCX35_kTswiXEMEa3E3w2Ry7IhPMc1sDXmlXywA2DpEtZcYzibDd_UtwvwLeMy6tWdDk7HFo9RXpw__2TepmeiDpWyzKBKUTmS8s\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJakarta Explorer tour bus from Transjakarta. Source: Jakarta Smart City\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW1:\u0026nbsp;Sejarah Jakarta\u0026nbsp;(History of Jakarta)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eAre you fond of Jakarta's history? Well, then you should take the BW1 route:\u0026nbsp;\u003ci\u003eSejarah Jakarta\u003c/i\u003e (History of Jakarta). This route passes by important places, for example, the Jakarta City Hall, which serves as Jakarta's administrative centre. Besides, you can also see one of Indonesia's most important icons, the National Monument (Monumen Nasional/Monas).\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW1: History of Jakarta operates from Monday to Saturday from 10:00 AM to 6:00 PM Indonesian Western Time. On Sundays, you can take it from 9:00 AM to 7:00 PM. The places covered by this route include:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJakarta City Hall;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eNational Museum (Museum Nasional);\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGedung Arsip;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum BI (Bank Indonesia);\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBNI 46;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMasjid Jami Kebon Jeruk;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePasar Baru;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/zdirK7bUk63gdMCVTQyqreq5Nf2AOtN45rU8THCeRBH_ELZVjM2lBbkPRVjnWH8ByHCnizHbac2BLipmK__0aWrqczGa28hKdR65YFMVnYKyDSAMhkGkYgeNT8WH0T2Vi7ybchs7NSXOIlmF5spugeg\" alt=\"BW1:\u0026nbsp;Sejarah Jakarta\u0026nbsp;(History of Jakarta) travel map. Source:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW1:\u0026nbsp;\u003ci\u003eSejarah Jakarta\u0026nbsp;\u003c/i\u003e(History of Jakarta) travel map. Source:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBefore taking it, you should pay attention to its route. The stops serving the BW1 route: History of Jakarta are:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBank Indonesia Museum; and\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKali Besar Barat 1.\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/Oqvjq75uiSeWukKSSeccDpSY9I1OQtyA22bACpe3GW80ez3bcJtpds7MokH3e4W-KNsL2OyRxVBQrzgJJVIcKK_D6ZRbzkUrfOnFkdrBJhDeRrRSHbFq6r3ZGe271rGIcbpiay7T2AnOvCFSRWP-V00\" alt=\"BW1:\u0026nbsp;Sejarah Jakarta\u0026nbsp;(History of Jakarta) route map. Source: transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW1:\u0026nbsp;\u003ci\u003eSejarah Jakarta\u0026nbsp;\u003c/i\u003e(History of Jakarta) route map. Source: transjakarta.co.id\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW2:\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003e \u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eJakarta Baru (Jakarta Modern)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eAre you that much of a modern person? For those who want to enjoy Jakarta's modernity, please take the BW2 route:\u0026nbsp;\u003ci\u003eJakarta Baru\u003c/i\u003e (Jakarta Modern). This route passes through Jakarta's flagship malls, such as Sarinah. There, you can explore shops selling various local products and enjoy Jakarta from its rooftop and platforms. There's also Plaza Indonesia, a mall suitable for your recreation.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eYou can enjoy BW2: New Jakarta (Jakarta Modern) every Monday to Saturday from 10:00 AM to 6:00 PM WIB and on Sundays from 12:00 PM to 7:00 PM. The complete places covered are:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePlaza Indonesia;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMenara Topas;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum Nasional;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePecenongan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePasar Baru;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda/Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/6IQsi4-cXa2cs54KGSIgtzQP2FiV-4QOg5Kj5CdvCF0rRxScHO20jGdvtTSnQh57BHr2cESgwzdJUgkAp5e8SDw3EdVVH6aGq4v3LZ-HcXZgsiDPV9vx54awhmjsu16QkutNgHey5xbOyDODAZNdbzs\" alt=\"BW2: Jakarta Baru (Jakarta Modern) travel map. Source:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW2: \u003ci\u003eJakarta Baru\u003c/i\u003e (Jakarta Modern) travel map. Source:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDon't forget to pay attention to its route as well. There are several stops serving it:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePerpustakaan Nasional;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDPRD DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTugu Tani 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGambir 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 3.\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/cijDVDdyCuRX6utElRw2PFgccJhmFjkflkQgeFm7GwajN5NnViUFbbhJU5VtHBhlE9oi69t4jJ_c__z76p-bjZZZ1Sfvp3t8T1bTsql4HWYu36BBlSzCAOEu7S_uLR_y6yrkeThYgh8DLbtRxrAAtC8\" alt=\"BW2: Jakarta Baru (Jakarta Modern) route map. Source:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW2: \u003ci\u003eJakarta Baru\u003c/i\u003e (Jakarta Modern) route map. Source:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/peta-rute/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW3:\u0026nbsp;Kesenian dan Kuliner\u0026nbsp;(Arts and Culinary)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eFor those who love arts and culinary delights, the Transjakarta tour bus can also spice up your weekends. The BW3 route: Arts and Culinary passes through interesting trading areas like Pasar Baru. There are various culinary delights along the way.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW3: Arts and Culinary operates every Saturday from 10:00 AM to 11:00 PM WIB. From Balai Kota DKI Jakarta to IRTI, here are the places covered:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum Nasional;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGedung Arsip;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMuseum BI;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBNI 46;\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMasjid Kebon Jeruk;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePasar Baru;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda/Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/hUTpm7UlM5kadAbQnZXOLXTeod4DxYXDT21WtX39DKox41TV3j07hYOa4LPXaOS7ljSJ62qSE10qZMgu2juILRE6spjxLEvMTJcCt-MU_UuV9egseTtzuGUTRhXFUCejEMWBKTEmkoD9sRYFfm7JML0\" alt=\"BW3: Arts and Culinary travel map. Source\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW3: \u003ci\u003eKesenian dan Kuliner \u003c/i\u003e(Arts and Culinary) travel map. Source\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW4: Pencakar Langit\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e(Jakarta Skyscrapers)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJakarta plays a role as an economic center. This is why there are many tall buildings housing offices. One of the famous ones is the Wisma 46 building shaped like a pen. It's located on Jalan Jenderal Sudirman, Central Jakarta, which includes the Dukuh Atas area. If you're interested in seeing it, you can take the BW4 route: Jakarta Skyscrapers.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eNot only on weekends, but you can also enjoy the BW4 route: Jakarta Skyscrapers every Monday to Friday from 6:00 AM to 5:00 PM WIB. On Saturdays, the route operates from 10:00 AM to 5:00 PM WIB and on Sundays, from 12:00 PM to 7:00 PM WIB. Here's a list of places covered:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eThamrin 10;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eWisma Nusantara;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDukuh Atas 3;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKaret Sudirman 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGBK 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBundaran Senayan 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000; ce:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW4: \u003ci\u003ePencakar Langit \u003c/i\u003e(Jakarta Skyscrapers) route map. Source:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/peta-rute/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW5: Ruang Terbuka (Jakarta Open Space)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eGreen Open Space (\u003ci\u003eRuang Terbuka Hijau\u003c/i\u003e/RTH) can be a healthy recreational area. Its management is regulated by\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://jdih.jakarta.go.id/dokumen/detail/4911/peraturan-gubernur-nomor-9-tahun-2022-tentang-ruang-terbuka-hijau\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003ci\u003e\u003cu\u003ePeraturan Gubernur\u003c/u\u003e\u003c/i\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003ci\u003e\u0026nbsp; Nomor 9 Tahun 2022 tentang Ruang Terbuka Hijau\u003c/i\u003e (Governor Regulation Number 9 of 2022 concerning Green Open Space). If you take the BW5 route: Jakarta Open Space, don't forget to visit the Kalijodo\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://www.instagram.com/p/B4fDd7sAl-e/?img_index=1\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003eRPTRA (Ruang Publik Terpadu Ramah Anak)\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e! As an open space, RPTRA Kalijodo has various facilities for visitors to enjoy.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW5: Jakarta Open Space also operates on weekdays, every Monday to Friday from 10:00 AM to 6:00 PM WIB. Additionally, you can enjoy its service on Saturdays from 10:00 AM to 11:00 PM WIB and Sundays from 12:00 PM to 7:00 PM WIB. Let's take a note of its journey:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eRPTRA Kalijodo;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBundaran HI;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/5K0cqxjG4PvzdQaBMQKdAo72Q1vLkoibJ9_QMHXeHADD5b7s2bT3cIczKt3qKvQ2slq9gDtNMjpjiHoXQwANQDvZczFiy8Y_LfhZvTr_xH1Nzj4GJ-V1hXW42I6hUUIHnXmL2_8cL7X45juJTIVb8VE\" alt=\"BW5: Jakarta Open Space travel map. Source:\u0026nbsp;transjakarta.co.id  \"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW5: \u003ci\u003eRuang Terbuka\u003c/i\u003e (Jakarta Open Space) travel map. Source:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW6:\u0026nbsp;Cagar Budaya Jakarta (Jakarta Heritage)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eCultural heritage is created to preserve an area. In North Jakarta, there's the Mbah Priok Tomb, considered sacred. It's easy to visit there! You can take the BW6 route: Jakarta Heritage.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eInterested? Let's spend your time every Saturday to Sunday from 10:00 AM to 7:00 PM WIB, according to operational hours. This tour bus also passes through the following places:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBalai Kota DKI Jakarta;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMakam Mbah Priok;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBundaran HI;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMenara Topas;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eJuanda/Istiqlal;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eMonas 1; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/9-caQVxM3IWDzXPJ5rfUxRwwz509JrjgV5ckfqcxHS54_DzE66DeOEZBU88vCtQCDvdf1QKgtf3lRGZW2UNCF8GPoIP2hpcYAUUIpkA_J2DZcA9JrAYwccp5SdVkbVC7XyGL-SpRSj2bxCtopXiHS88\" alt=\"BW6:\u0026nbsp;Cagar Budaya Jakarta (Jakarta Heritage) travel map. Source:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW6:\u0026nbsp;\u003ci\u003eCagar Budaya Jakarta\u003c/i\u003e (Jakarta Heritage) travel map. Source:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eBW7:\u0026nbsp;Belanja Jakarta (Jakarta Shopping)\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eAre you a shopaholic? Well, this tour bus is perfect for you. BW7:\u0026nbsp;\u003ci\u003eBelanja Jakarta\u003c/i\u003e (Jakarta Shopping) serves a route passing through various shopping centers, such as Plaza Senayan and Senayan City.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW7: Jakarta Shopping is another route that operates on weekdays, from Monday to Friday, from 10:00 AM to 6:00 PM WIB. Every Saturday, you can enjoy it from 10:00 AM to 10:00 PM WIB. Here are the complete places covered, don't forget to note them:\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eWisma Nusantara;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDukuh Atas 3;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKaret Sudirman 1;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eLapangan Panahan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIstora Senayan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePlaza Senayan;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSenayan City;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eKaret Sudirman 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eDukuh Atas 4;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eStasiun Sudirman;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eTosari 2;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePlaza Indonesia;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eSarinah 2; dan\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eIRTI.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/ZxYjI5qu9rIEoWaPcw6te1hxyR8ln_r103GhqJGg-oegVbTt0JWBlINp55dTM-Qmi3hz6k6-Ue6pEArL-lAEdaLJjuOaiN8CRaTvlllQXhbz8Q__bezl5wKkaAofeYAFJRbYnxeSf4vaK7lFeERoWpw\" alt=\"BW7: Belanja Jakarta (Jakarta Shopping) route map. Source:\u0026nbsp;transjakarta.co.id\"\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eBW7:\u003ci\u003e Belanja Jakarta\u003c/i\u003e (Jakarta Shopping) route map. Source:\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/layanan-bus/bus-wisata/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003etransjakarta.co.id\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cstrong\u003eWhat's the Fare for Transjakarta Bus Tour?\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003ePT Transportasi Jakarta provides services with 22 Jakarta Explorer tour buses for the seven routes mentioned above. What's interesting is that you can go around Jakarta with a double-decker bus concept. Is the fare more expensive than regular Transjakarta buses? Turns out, no! In fact, by riding Jakarta Explorer, you're only charged\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://x.com/PT_Transjakarta/status/1652243634970845186?s=20\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003eRp0\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e which means it's free. However, you still need to tap in or touch your\u003c/span\u003e\u003ca href=\"https://transjakarta.co.id/produk-dan-layanan/info-tiket/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003e electronic card\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u0026nbsp; on the machine.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003eAre you ready to have fun with Jakarta Explorer? Your daily life can also be made easier by riding Transjakarta buses. Plus,\u0026nbsp;\u003c/span\u003e\u003ca href=\"https://jaki.jakarta.go.id/en/\"\u003e\u003cspan style=\"background-color:transparent;color:#1155cc;\"\u003e\u003cu\u003eJAKI\u003c/u\u003e\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e makes it easy for you to check schedules, routes, and fares. Once the application is open, you just need to search for the Public Transport feature on the search bar and click on Transjakarta.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003cimg src=\"https://lh7-us.googleusercontent.com/Rlsd5_eH5dn5hoWY1Fsh5ZjRj-YGxVIWWRUZw7VH-F53SxtAVwBzMBIbc0zzrojZOb70Ez4Qg80mciS4qpVn7seCsfTobJgm2CNhy1NqTnOGLd2Ck4McR5reCOvXvCUbpYAhtVHVrdt1U70xTLI_NXo\" alt=\"Public Transport Feature in JAKI\"\u003e\u003c/span\u003e
